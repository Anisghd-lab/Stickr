name: Build Stickr Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK for release
        run: |
          mkdir -p release_apk
          cp app/build/outputs/apk/debug/app-debug.apk release_apk/Stickr-v1.0.0.apk

      - name: Upload APK as GitHub Action Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Stickr-v1.0.0-APK
          path: release_apk/Stickr-v1.0.0.apk
          retention-days: 30

      - name: Publish GitHub Release with APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Stickr v1.0.0 (APK Release)"
          body: |
            ### 🎨 Stickr — Application Android Native
            
            Téléchargez et installez directement le fichier APK officiel sur votre smartphone Android.

            #### ✨ Fonctionnalités incluses :
            - **Détourage IA instantané** local avec Google MediaPipe Vision (`selfie_segmenter.tflite`).
            - **Éditeur graphique tactile Jetpack Compose (Material 3)** avec contour die-cut vinyle personnalisable.
            - **Calques de texte stylisé mème** (Impact, Sans-Serif, Serif, etc.) avec stroke & fill et accessoires interactifs.
            - **Intégration officielle WhatsApp** : création de packs, export en 1-clic et streaming via ContentProvider.
            - **Optimisations Android 15 (SDK 35)** : Edge-to-Edge natif, Splash Screen AndroidX et icônes adaptatives Material You.

            #### 📲 Installation :
            1. Téléchargez le fichier **`Stickr-v1.0.0.apk`** ci-dessous.
            2. Ouvrez-le sur votre smartphone Android pour l'installer (autorisez l'installation d'applications de sources inconnues si demandé).
          files: |
            release_apk/Stickr-v1.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
